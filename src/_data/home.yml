hero_title: "Pomagam družinam do mirnih noči in spočite mame."
hero_subtitle: "Svetovanje za spanje dojenčkov in malčkov, prilagojeno vaši družini."
hero_image: "/assets/images/tomoko-uji-kxvn1ogpTtE-unsplash.jpg"
komu_title: "Komu pomagam"
komu: "Če vaš dojenček težko zaspi, se ponoči pogosto prebuja ali potrebujete usmeritve pri rutini, skupaj bomo našli način, da bo spanje lažje."
problems_title: "Se prepoznate?"
problems_lead: "Najpogostejše težave, s katerimi me obiščejo družine."
problems:
  - title: "Težko uspavanje"
    text: "Uspavanje traja dolgo in zahteva zibanje, vožnjo ali dojenje do spanca."
  - title: "Pogosta nočna prebujanja"
    text: "Otrok se ponoči večkrat zbudi in težko zaspi nazaj brez vaše pomoči."
  - title: "Kratki dnevni spanci"
    text: "Spanci trajajo le 30–45 minut, otrok je čez dan utrujen in siten."
  - title: "Zgodnje jutranje bujenje"
    text: "Dan se začne ob petih zjutraj, čeprav gre otrok dovolj zgodaj spat."
  - title: "Odvisnost od pomoči"
    text: "Otrok zaspi le ob določenem pogoju – prsih, dudi ali v naročju."
  - title: "Prehodi in mejniki"
    text: "Selitev v posteljico, opuščanje spancev, zobje ali razvojni skoki."
steps_title: "Kako poteka"
steps_lead: "Štirje koraki do mirnejših noči."
steps:
  - title: "Uvodni pogovor"
    text: "Kratek klic za spoznavanje"
  - title: "Analiza"
    text: "Pregled rutine in spanca"
  - title: "Načrt po meri"
    text: "Konkretni koraki za vašo družino"
  - title: "Mirnejše noči"
    text: "Podpora med izvajanjem"
eva_title: "Eva"
eva_text: "Fizioterapevtka in svetovalka za spanje. Mame me obiščejo, ko so utrujene in želijo nežne, a učinkovite rešitve."
eva_link_label: "Preberi več o meni"
posts_title: "Najnovejši nasveti"
posts_lead: "Praktični članki o spanju dojenčkov in malčkov."
cta_title: "Pripravljeni na mirnejše noči?"
cta_text: "Začnimo z brezplačnim uvodnim pogovorom."
