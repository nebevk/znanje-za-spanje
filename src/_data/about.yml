name: "Eva"
photo: "/assets/images/eva_silhouete.png"
photo_alt: "Eva"
bio:
  - "Sem fizioterapevtka, ki se specializira v svetovanju za spanje dojenčkov in malčkov. Združujem znanja iz fizioterapije z nežnimi pristopi za izboljšanje spanja, prilagojenimi vsaki družini."
  - "Po lastnih izkušnjah materinstva sem spoznala, kako močno pomanjkanje spanja vpliva na celotno družino, in kako pomembno je imeti nekoga, ki vas pelje korak za korakom skozi spremembe, ne da bi obsojal vaše dosedanje odločitve."
trust_title: "Zakaj mi lahko zaupate"
trust:
  - "Izkušnje s sodelovanjem z mladimi družinami"
  - "Pristop, ki spoštuje starševski stil in otrokove potrebe"
  - "Strokovno znanje iz fizioterapije in razvoja dojenčkov"
  - "Podpora po posvetu, ne ostanete sami"
stats:
  - label: "Družin podprtih"
    value: "100+"
  - label: "Let izkušenj"
    value: "5"
  - label: "Pristop"
    value: "Nežen, brez joka"
approach_title: "Nežno, postopno, brez stresa"
approach_lead: "Ne verjamem v metode \"pusti ga jokati\". Verjamem v predvidljivost, jasne meje in v to, da ima vsak otrok svoj tempo."
approach:
  - title: "Razumevanje pred ukrepanjem"
    text: "Najprej razumemo, zakaj se nekaj dogaja. Šele nato spreminjamo."
  - title: "Spoštovanje vaših vrednot"
    text: "Načrt prilagodimo temu, kar se vam zdi prav, ne nasprotno."
  - title: "Postopne spremembe"
    text: "Majhni, jasni koraki. Brez šokov za otroka in brez stresa za starše."
faq_title: "Pogosta vprašanja"
faq:
  - question: "Pri kateri starosti otroka lahko začnemo?"
    answer: "Načeloma od 4. meseca dalje, ko se začnejo vzpostavljati zrelejši cikli spanja. Pri mlajših dojenčkih se pogovarjamo predvsem o realnih pričakovanjih, varnem spancu in podpori starša."
  - question: "Ali delate na daljavo?"
    answer: "Da, večina posvetov poteka preko videoklica (Zoom ali Google Meet). To je za večino družin tudi udobnejše. Pogovor lahko opravimo med otrokovim spancem ali zvečer."
  - question: "Ali zagovarjate metodo \"cry it out\"?"
    answer: "Ne. Moj pristop je nežen in postopen. Otroka nikoli ne pustimo samega v stiski. Cilj je, da se otrok nauči zaspati v varnem okolju, kjer ve, da je mama ali oče v bližini."
  - question: "Koliko časa traja, da vidimo izboljšave?"
    answer: "Večina družin opazi prve spremembe v 7–10 dneh. Stabilnejše rezultate običajno dosežemo v 2–3 tednih, odvisno od izhodišča in doslednosti."
  - question: "Ali še lahko dojim ponoči?"
    answer: "Seveda. Načrt prilagodim vašemu načinu hranjenja: dojenju, stekleničkam ali kombinaciji. Cilj ni odstavitev, ampak boljši spanec znotraj načina, ki vam ustreza."
  - question: "Kaj če imamo dvojčke ali več otrok?"
    answer: "Sodelujem tudi z družinami z dvojčki in več otroki. Načrt v takem primeru upošteva dinamiko vse družine in praktične omejitve, ki jih to prinese."
cta_title: "Pripravljeni na pogovor?"
cta_text: "Začnimo s kratkim, brezplačnim uvodnim klicem."
