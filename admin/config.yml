backend:
  name: git-gateway
  branch: master

media_folder: "assets/images"
public_folder: "/assets/images"

# Files allow single-instance content (homepage blocks, settings)
files:
  - file: "src/_data/site.yml"
    label: "Splošno (site settings)"
    name: "site_settings"
    fields:
      - { label: "Brand name", name: "brand", widget: "string", default: "Teta Luna" }
      - { label: "Slogan / tagline", name: "tagline", widget: "string", default: "Znanje za spanje", hint: "Prikazan pod glavnim imenom v navigaciji." }
      - { label: "Contact email", name: "email", widget: "string", default: "eva@example.com" }
      - { label: "Instagram", name: "instagram", widget: "string", default: "@znanje_za_spanje" }
      - { label: "Spletni naslov (URL)", name: "url", widget: "string", default: "https://znanjezaspanje.netlify.app", hint: "Polni naslov strani, uporabljen za predogled pri deljenju povezav (Facebook, ...)." }
      - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Logotip v glavi. Najbolje SVG ali PNG s prozornim ozadjem." }
      - { label: "Logo v nogi", name: "logo_footer", widget: "image", required: false, hint: "Svetlejša različica logotipa za temno nogo." }
      - { label: "Primary barva", name: "color_primary", widget: "color", default: "#1A5C4A", enableAlpha: false, hint: "Gumbi in poudarki. Velja po objavi (Netlify znova zgradi stran)." }
      - { label: "Accent barva", name: "color_accent", widget: "color", default: "#C9B896", enableAlpha: false }
      - { label: "Secondary barva", name: "color_secondary", widget: "color", default: "#2C3540", enableAlpha: false, hint: "Temnejši gumbi in oznake." }
      - { label: "Gumb v meniju — besedilo", name: "nav_cta_label", widget: "string", default: "Rezerviraj posvet" }
      - { label: "Gumb v meniju — povezava", name: "nav_cta_href", widget: "string", default: "/kontakt" }
      - { label: "Besedilo v nogi", name: "footer_text", widget: "text" }
      - label: "Meni v glavi"
        name: nav
        widget: list
        summary: "{{label}} → {{href}}"
        hint: "Povezave v zgornjem meniju. Gumb za rezervacijo je ločen."
        fields:
          - { label: "Besedilo", name: label, widget: string }
          - { label: "Povezava", name: href, widget: string, hint: "npr. /o-meni ali https://..." }
      - label: "Meni v nogi"
        name: footer_nav
        widget: list
        summary: "{{label}} → {{href}}"
        fields:
          - { label: "Besedilo", name: label, widget: string }
          - { label: "Povezava", name: href, widget: string }

  - file: "src/_data/home.yml"
    label: "Domov - vsebina"
    name: "home"
    fields:
      - { label: "Hero title", name: "hero_title", widget: "string", default: "Pomagam družinam do mirnih noči in spočite mame." }
      - { label: "Hero subtitle", name: "hero_subtitle", widget: "text", default: "Svetovanje za spanje dojenčkov in malčkov, prilagojeno vaši družini." }
      - { label: "Hero image", name: "hero_image", widget: "image", required: false, hint: "Slika v ozadju hero sekcije na naslovni strani. Uporabi širinski (landscape) format, vsaj 1600×900 px. Pokončne slike ne delujejo dobro." }
      - { label: "Komu pomagam (paragraph)", name: "komu", widget: "text", default: "Če vaš dojenček težko zaspi..." }

collections:
  - name: "posts"
    label: "Blog / Nasveti"
    folder: "src/posts"
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      # Vrednosti (value) morajo ustrezati seznamu CATEGORIES v .eleventy.js
      - label: "Kategorija"
        name: "category"
        widget: "select"
        required: false
        hint: "Razvrsti članek v bazo znanja."
        options:
          - { label: "Osnove spanja", value: "osnove" }
          - { label: "Nočna prebujanja", value: "prebujanja" }
          - { label: "Dnevni spanci in ritem", value: "ritem" }
          - { label: "Prehodi", value: "prehodi" }
          - { label: "Hranjenje in spanje", value: "hranjenje" }
          - { label: "Starostna obdobja", value: "starost" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "testimonials"
    label: "Mnenja mamic"
    folder: "src/testimonials"
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: "Quote", name: "quote", widget: "text" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Role", name: "role", widget: "string", required: false, hint: "npr. 'mama 10-mesečnega fantka'" }
      - { label: "Order", name: "order", widget: "number", required: false, default: 0, hint: "Manjše število = višje na strani" }
      - { label: "Photo", name: "photo", widget: "image", required: false }

  - name: "services"
    label: "Storitve"
    folder: "src/services"
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Duration", name: "duration", widget: "string", required: false, hint: "npr. '45 min' ali '60 min + 14 dni podpore'" }
      - { label: "Price", name: "price", widget: "string", required: false, hint: "npr. '60 €'. Če pustiš prazno, se prikaže 'Cena na povpraševanje'." }
      - { label: "Features (kaj je vključeno)", name: "features", widget: "list", required: false, hint: "Vsaka postavka je ena alineja s kljukico. Loči jih z vejico ali Enter." }
      - { label: "Badge", name: "badge", widget: "string", required: false, hint: "npr. 'Osnovni', 'Najbolj priljubljeno'" }
      - { label: "Featured", name: "featured", widget: "boolean", required: false, default: false, hint: "Označi kot izpostavljeno (večja kartica, drugačna barva)" }
      - { label: "Order", name: "order", widget: "number", required: false, default: 0, hint: "Manjše število = bolj levo" }
      - { label: "Full description", name: "body", widget: "markdown", required: false }
